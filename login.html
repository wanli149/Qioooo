<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - QIoooo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 顶部导航栏（简化版） -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">QIoooo</a>
            </div>
        </div>
    </header>

    <!-- 登录/注册内容区 -->
    <main class="auth-content">
        <div class="container">
            <div class="auth-container">
                <!-- 登录表单 -->
                <div class="auth-form login-form active">
                    <h2>登录</h2>
                    <form>
                        <div class="form-group">
                            <label for="login-username">用户名/手机号</label>
                            <input type="text" id="login-username" placeholder="请输入用户名或手机号">
                        </div>
                        <div class="form-group">
                            <label for="login-password">密码</label>
                            <input type="password" id="login-password" placeholder="请输入密码">
                        </div>
                        <div class="form-group remember">
                            <label>
                                <input type="checkbox" id="remember-me"> 记住我
                            </label>
                            <a href="#" class="forgot-password">忘记密码？</a>
                        </div>
                        <button type="submit" class="btn-submit">登录</button>
                    </form>
                    <div class="social-login">
                        <p>使用以下方式登录</p>
                        <div class="social-buttons">
                            <button class="btn-social wechat">
                                <i class="fab fa-weixin"></i> 微信登录
                            </button>
                            <button class="btn-social qq">
                                <i class="fab fa-qq"></i> QQ登录
                            </button>
                        </div>
                    </div>
                    <div class="switch-form">
                        还没有账号？ <a href="#" class="switch-to-register">立即注册</a>
                    </div>
                </div>

                <!-- 注册表单 -->
                <div class="auth-form register-form">
                    <h2>注册</h2>
                    <form>
                        <div class="form-group">
                            <label for="register-username">用户名</label>
                            <input type="text" id="register-username" placeholder="请输入用户名">
                        </div>
                        <div class="form-group">
                            <label for="register-phone">手机号</label>
                            <input type="tel" id="register-phone" placeholder="请输入手机号">
                            <button type="button" class="btn-send-code">发送验证码</button>
                        </div>
                        <div class="form-group">
                            <label for="register-code">验证码</label>
                            <input type="text" id="register-code" placeholder="请输入验证码">
                        </div>
                        <div class="form-group">
                            <label for="register-password">密码</label>
                            <input type="password" id="register-password" placeholder="请输入密码">
                        </div>
                        <div class="form-group">
                            <label for="register-confirm-password">确认密码</label>
                            <input type="password" id="register-confirm-password" placeholder="请再次输入密码">
                        </div>
                        <div class="form-group agree">
                            <label>
                                <input type="checkbox" id="agree-terms"> 我已阅读并同意
                                <a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a>
                            </label>
                        </div>
                        <button type="submit" class="btn-submit">注册</button>
                    </form>
                    <div class="switch-form">
                        已有账号？ <a href="#" class="switch-to-login">立即登录</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚（简化版） -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="copyright">
                    <p>© 2024 QIoooo. All rights reserved.</p>
                    <p>ICP备案号：京ICP备XXXXXXXX号</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
